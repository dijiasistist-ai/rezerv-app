services:
  - type: web
    name: tyee-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AVAX_BOT_ENABLED
        value: "true"
      - key: AVAX_BOT_LIVE_TRADING
        value: "false"
      - key: AVAX_BOT_BINANCE_TESTNET
        value: "false"
      - key: AVAX_BOT_LEVERAGE
        value: "2"
      - key: AVAX_BOT_WALLET_FRACTION
        value: "0.20"
      - key: AVAX_BOT_PAPER_TOURNAMENT
        value: "true"
      - key: AVAX_BOT_PAPER_INITIAL_USDT
        value: "6000"
      - key: AVAX_BOT_PAPER_STATE_KEY
        value: top50-three-strategy-v1
      - key: AVAX_BOT_COPY_TRADING
        value: "true"
      - key: AVAX_BOT_COPY_WALLETS
        value: 0xdc9bf10e6b88f0657d02179ca338e0ffe9ecc564,0x4721d4bcf69f585801362feac273e8389d1a45ec
      - key: AVAX_BOT_COPY_INITIAL_USDT
        value: "6000"
      - key: AVAX_BOT_COPY_WALLET_FRACTION
        value: "0.10"
      - key: AVAX_BOT_COPY_STATE_KEY
        value: hyperliquid-copy-two-wallets-v1
      - key: AVAX_BOT_DASHBOARD_URL
        value: https://tyee.app
  - type: worker
    name: tyee-futures-worker
    runtime: python
    buildCommand: pip install -r futures-worker/requirements.txt
    startCommand: python futures-worker/run.py
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AVAX_BOT_ENABLED
        value: "true"
      - key: AVAX_BOT_LIVE_TRADING
        value: "false"
      - key: AVAX_BOT_BINANCE_TESTNET
        value: "false"
      - key: AVAX_BOT_LEVERAGE
        value: "2"
      - key: AVAX_BOT_WALLET_FRACTION
        value: "0.20"
      - key: AVAX_BOT_TAKE_PROFIT_ROE
        value: "0.055"
      - key: AVAX_BOT_MICROSTRUCTURE_ENFORCE
        value: "false"
      - key: AVAX_BOT_PAPER_TOURNAMENT
        value: "true"
      - key: AVAX_BOT_PAPER_INITIAL_USDT
        value: "6000"
      - key: AVAX_BOT_PAPER_STATE_KEY
        value: top50-three-strategy-v1
      - key: AVAX_BOT_COPY_TRADING
        value: "true"
      - key: AVAX_BOT_COPY_WALLETS
        value: 0xdc9bf10e6b88f0657d02179ca338e0ffe9ecc564,0x4721d4bcf69f585801362feac273e8389d1a45ec
      - key: AVAX_BOT_COPY_INITIAL_USDT
        value: "6000"
      - key: AVAX_BOT_COPY_WALLET_FRACTION
        value: "0.10"
      - key: AVAX_BOT_COPY_STATE_KEY
        value: hyperliquid-copy-two-wallets-v1
      - key: AVAX_BOT_PAPER_DURATION_HOURS
        value: "48"
      - key: AVAX_BOT_PAPER_STATE_PATH
        value: /tmp/tyee-futures-tournament.json
      - key: AVAX_BOT_PAPER_DEMO_SECONDS
        value: "0"
      - key: AVAX_BOT_DASHBOARD_URL
        value: https://tyee.app
      - key: AVAX_BOT_DASHBOARD_INGEST_TOKEN
        sync: false
